<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>高階認知挑戰紙本生成器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#FFFCF7;--panel:#FFFFFF;--ink:#12343B;--muted:#5E7075;--line:#EDE3D6;--soft:#FBF5EC;
  --orange:#E8552D;--amber:#F4A93C;--teal:#028090;--tealSoft:#E4F2F2;--desk:#EFE8DE;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F2327;--panel:#15303A;--ink:#F3EEE6;--muted:#A8BCC0;--line:#27474F;--soft:#1A3943;--tealSoft:#18414A;--desk:#0B1B1F;}}
:root[data-theme="dark"]{--bg:#0F2327;--panel:#15303A;--ink:#F3EEE6;--muted:#A8BCC0;--line:#27474F;--soft:#1A3943;--tealSoft:#18414A;--desk:#0B1B1F;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;font-size:16px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.top{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;padding:26px 28px 18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:16px}
.mark{width:58px;height:58px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;flex:none}
.mark span{border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px}
.mark span:nth-child(1){background:var(--orange)}.mark span:nth-child(2){background:var(--amber);color:#12343B}
.mark span:nth-child(3){background:var(--teal)}.mark span:nth-child(4){background:#12343B;border:1px solid var(--line)}
h1{margin:0;font-size:clamp(22px,3vw,30px);font-weight:900;letter-spacing:.02em}
.top p{margin:2px 0 0;color:var(--muted);max-width:60ch}

.main{display:grid;grid-template-columns:360px 1fr;min-height:calc(100vh - 120px)}
@media (max-width:900px){.main{grid-template-columns:1fr}}
aside{padding:22px 24px 40px;border-right:1px solid var(--line);background:var(--panel)}
@media (max-width:900px){aside{border-right:0;border-bottom:1px solid var(--line)}}
.sec{margin-bottom:22px}
.sec>label,.sec>.lab{display:block;font-weight:700;margin-bottom:8px}
.sec .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text]{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
select{padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);width:100%}

.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tchip{position:relative;display:block;cursor:pointer}
.tchip input{position:absolute;opacity:0;pointer-events:none}
.tchip .in{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);min-height:62px;transition:border-color .15s,background .15s}
.tchip .g{flex:none;width:42px;height:42px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font-weight:900;font-size:13px;white-space:nowrap;letter-spacing:-.02em;color:var(--teal)}
.tchip b{display:block;font-size:14.5px;line-height:1.25}
.tchip small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.tchip input:checked+.in{border-color:var(--teal);background:var(--tealSoft)}
.tchip input:checked+.in .g{background:var(--teal);color:#fff}
.tchip input:focus-visible+.in{outline:3px solid var(--amber);outline-offset:2px}
.mini{border:0;background:none;color:var(--teal);font-weight:700;cursor:pointer;padding:2px 4px;font-size:14px}

.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);padding:9px 6px;cursor:pointer;line-height:1.25}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:700}
.seg button small{display:block;font-size:11px;opacity:.8;letter-spacing:.1em}
.step{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;width:max-content}
.step button{width:42px;height:40px;border:0;background:var(--soft);font-size:20px;cursor:pointer}
.step output{min-width:56px;text-align:center;font-weight:700}
.check{display:flex;gap:10px;align-items:center;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--teal)}

.acts{display:grid;gap:10px;margin-top:6px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:16px;cursor:pointer;display:flex;justify-content:center;gap:8px}
.btn.re{background:var(--soft);color:var(--ink);border:1.5px solid var(--line)}
.btn.pdf{background:var(--orange);color:#fff}
.btn.doc{background:var(--teal);color:#fff}
.btn:disabled{opacity:.55;cursor:wait}
.status{min-height:1.5em;color:var(--muted);font-size:14px;margin-top:4px}

.preview{background:var(--desk);padding:20px 16px 60px;min-width:0}
.pvhead{display:flex;justify-content:space-between;align-items:baseline;max-width:820px;margin:0 auto 12px;color:var(--muted);font-size:14px;gap:12px;flex-wrap:wrap}
.pvhead strong{color:var(--ink);font-size:16px}
.pages{display:flex;flex-direction:column;align-items:center;gap:18px}
.pw{position:relative;flex:none}
.pw>.page{position:absolute;top:0;left:0;transform-origin:top left;box-shadow:0 1px 2px rgba(18,52,59,.15),0 8px 24px rgba(18,52,59,.10)}
.empty{max-width:520px;margin:60px auto;text-align:center;color:var(--muted)}

/* ===== A4 紙本 ===== */
.page{width:210mm;height:297mm;background:#fff;color:#12343B;padding:13mm 14mm 10mm;display:flex;flex-direction:column;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;line-height:1.45;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.2mm solid #12343B;padding-bottom:2mm}
.ph-title{font-size:21pt;font-weight:900;letter-spacing:.04em;line-height:1.2}
.ph-level{font-size:12pt;font-weight:700;color:#12343B;text-align:right;white-space:nowrap}
.ph-level .st{color:#E8552D;font-size:15pt;letter-spacing:.08em;margin-right:2mm}
.ph-level .st i{font-style:normal;color:#E5DCCD}
.ph-name{display:flex;gap:3mm;align-items:flex-end;font-size:13pt;margin-top:3.5mm}
.ph-name i{flex:1;border-bottom:.3mm solid #12343B;height:6mm}
.ph-name i:last-child{flex:.6}
.ph-type{display:flex;align-items:center;gap:3mm;margin-top:4mm}
.ph-type .tg{background:#028090;color:#fff;border-radius:2mm;padding:1mm 3mm;font-weight:900;font-size:15pt}
.ph-inst{margin-top:2.5mm;font-size:13.5pt;background:#FBF5EC;border-left:1.6mm solid #F4A93C;padding:2.5mm 3.5mm;line-height:1.5}
.ph.ans{border-bottom-color:#E8552D}
.pbody{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;padding:3mm 0 2mm;overflow:hidden}
.grp.box{border:.4mm solid #D9CFC0;border-radius:3mm;padding:3mm 5mm}
.bp{margin:0}
.bt{border-collapse:collapse;table-layout:fixed}
.bt td{padding:0 .8mm;text-align:center;vertical-align:middle;line-height:1.1;overflow:hidden}
.pf{display:flex;justify-content:space-between;font-size:9.5pt;color:#8A9A9D;border-top:.3mm solid #E5DCCD;padding-top:1.5mm}
  .unit{border-top:.4mm solid #E5DCCD;padding-top:2.5mm}
.unit:first-child{border-top:0;padding-top:0}
.uh{display:flex;gap:3mm;align-items:baseline;margin-bottom:2mm;font-size:13pt}
.uh b{background:#028090;color:#fff;border-radius:1.5mm;padding:.5mm 2.5mm;font-size:12.5pt}
.uh span{color:#5E7075}
#capture{position:fixed;left:-12000px;top:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="mark" aria-hidden="true"><span>▲</span><span>7</span><span>✓</span><span>?</span></div>
    <div>
      <h1>高階認知挑戰紙本生成器</h1>
      <p>給能力較好的成人與長輩：推理、規律、抑制、工作記憶與多步驟計算。每按一次就是一組新題目，附解答頁。</p>
    </div>
  </div>
</header>

<div class="main">
<aside>
  <div class="sec">
    <label for="title">學習單標題</label>
    <input type="text" id="title" value="動腦挑戰單" maxlength="20">
  </div>

  <div class="sec">
    <div class="lab" style="display:flex;justify-content:space-between;align-items:center">題型（可複選，每種一張）
      <span><button class="mini" id="allT">全選</button><button class="mini" id="noneT">清除</button></span></div>
    <div class="types" id="types"></div>
  </div>

  <div class="sec">
    <div class="lab">難度</div>
    <div class="seg" id="lv">
      <button data-v="1" aria-pressed="false">入門挑戰<small>★</small></button>
      <button data-v="2" aria-pressed="true">進階挑戰<small>★★</small></button>
      <button data-v="3" aria-pressed="false">高手挑戰<small>★★★</small></button>
    </div>
  </div>

  <div class="sec" style="display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start">
    <div>
      <div class="lab" style="font-weight:700;margin-bottom:8px">份數</div>
      <div class="step"><button id="cMinus" aria-label="減少份數">−</button><output id="cOut">1</output><button id="cPlus" aria-label="增加份數">＋</button></div>
    </div>
    <div>
      <label for="ansMode" style="font-weight:700;display:block;margin-bottom:8px">解答頁</label>
      <select id="ansMode"><option value="after">每張後面附解答</option><option value="end" selected>解答全部放最後</option><option value="none">不附解答</option></select>
    </div>
  </div>

  <div class="sec">
    <div class="lab">字級</div>
    <div class="seg" id="fs">
      <button data-v="1" aria-pressed="true">標準</button>
      <button data-v="1.1" aria-pressed="false">加大</button>
    </div>
  </div>

  <div class="sec">
    <label class="check"><input type="checkbox" id="nameLine" checked> 顯示姓名、日期欄</label>
  </div>

  <div class="sec">
    <label for="footer">頁尾文字</label>
    <input type="text" id="footer" value="愛迪樂健康促進團隊" maxlength="30">
  </div>

  <div class="acts">
    <button class="btn re" id="regen">重新出題</button>
    <button class="btn pdf" id="dlPdf">下載 PDF</button>
    <button class="btn doc" id="dlPpt">下載 PPT（可修改）</button>
    <div class="status" id="status" role="status"></div>
  </div>
</aside>

<section class="preview" aria-label="預覽">
  <div class="pvhead"><strong id="pvCount"></strong><span>預覽即為列印樣式（A4 直式）</span></div>
  <div class="pages" id="pages"></div>
</section>
</div>
<div id="capture" aria-hidden="true"></div>

<script>
/* ===== 題目產生器（純函式） ===== */
const R={
  int:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
};
const INK='#12343B', TEAL='#028090', ORANGE='#E8552D', BLANK_BG='#FDF1DC', GIVEN_BG='#F3EEE7';
const P=(runs,size,o={})=>({k:'p',runs:typeof runs==='string'?[{t:runs}]:runs,size,align:o.align||'left',after:o.after||0,before:o.before||0,ls:o.ls});
const T=(rows,widths,h,size,o={})=>({k:'table',rows,widths,h,size,align:o.align||'center',border:o.border||'grid',bw:o.bw,bc:o.bc});
const G=(blocks,box)=>({blocks,box:!!box});

/* ---------- 1 符號密碼算式 ---------- */
function genSym(lv){
  for(let tries=0;tries<200;tries++){
    const [A,B,C]=R.shuffle(['▲','●','■','★','◆']);
    const eqs=[]; let q,ans,vals;
    const J=(arr,op)=>arr.join(` ${op} `);
    if(lv===1){
      const a=R.int(2,9),b=R.int(1,9);
      const r=R.pick([2,3]); eqs.push([J(Array(r).fill(A),'＋'),r*a]);
      const nb=R.pick([1,2]); eqs.push([J([A,...Array(nb).fill(B)],'＋'),a+nb*b]);
      if(2*a-b>0&&Math.random()<.5){q=`${A} ＋ ${A} − ${B}`;ans=2*a-b;}else{q=`${B} ＋ ${B} ＋ ${A}`;ans=2*b+a;}
      vals=`${A}＝${a}，${B}＝${b}`;
    }else if(lv===2){
      const a=R.int(2,12),b=R.int(2,12),c=R.int(2,15);
      if(new Set([a,b,c]).size<3) continue;
      const r=R.pick([2,3]); eqs.push([J(Array(r).fill(A),'＋'),r*a]);
      eqs.push([J([A,B,B],'＋'),a+2*b]);
      if(c>b&&Math.random()<.5) eqs.push([`${C} − ${B}`,c-b]); else eqs.push([J([B,C,C],'＋'),b+2*c]);
      const opts=[[`${A} ＋ ${B} ＋ ${C}`,a+b+c],[`${C} ＋ ${C} − ${A}`,2*c-a],[`${B} ＋ ${C} − ${A}`,b+c-a]].filter(o=>o[1]>0);
      [q,ans]=R.pick(opts); vals=`${A}＝${a}，${B}＝${b}，${C}＝${c}`;
    }else{
      const a=R.int(2,9),b=R.int(2,9),c=R.int(2,9);
      if(new Set([a,b,c]).size<3) continue;
      eqs.push([`${A} × ${A}`,a*a]);
      if(b>a&&Math.random()<.5) eqs.push([`${B} − ${A}`,b-a]); else eqs.push([`${A} × ${B}`,a*b]);
      eqs.push([`${C} ＋ ${C} ＋ ${B}`,2*c+b]);
      const opts=[[`${B} × ${C} − ${A}`,b*c-a],[`${A} × ${C} ＋ ${B}`,a*c+b],[`${C} × ${C} − ${B}`,c*c-b]].filter(o=>o[1]>0);
      [q,ans]=R.pick(opts); vals=`${A}＝${a}，${B}＝${b}，${C}＝${c}`;
    }
    return {eqs,q,ans,vals};
  }
}
function pageSym(lv){
  const groups=[],ans=[];
  for(let i=0;i<3;i++){
    const z=genSym(lv);
    const g=[P([{t:`第 ${i+1} 題`,b:true,c:TEAL}],13,{after:2})];
    z.eqs.forEach(e=>g.push(P(`${e[0]} ＝ ${e[1]}`,24,{after:2,ls:true})));
    g.push(P([{t:`${z.q} ＝ `},{t:'＿＿＿＿',c:ORANGE}],24,{before:1,ls:true}));
    groups.push(G(g,true));
    ans.push(P([{t:`第 ${i+1} 題　`,b:true},{t:`${z.vals}；答案 `},{t:String(z.ans),b:true,c:ORANGE}],16,{after:4}));
  }
  return {groups,ans:[G(ans)]};
}

/* ---------- 2 數字規律 ---------- */
const SEQ={
 1:[
  ()=>{const s=R.int(1,20),d=R.int(2,9);return{id:'add',a:[...Array(7)].map((_,n)=>s+d*n),rule:`每次加 ${d}`};},
  ()=>{const d=R.int(2,9),s=R.int(6*d+5,6*d+40);return{id:'sub',a:[...Array(7)].map((_,n)=>s-d*n),rule:`每次減 ${d}`};},
  ()=>{const s=R.int(1,5);return{id:'dbl',a:[...Array(6)].map((_,n)=>s*2**n),rule:'每次乘以 2'};},
 ],
 2:[
  ()=>{const a=R.int(4,9),b=R.int(1,a-2),s=R.int(1,15);const r=[s];for(let i=1;i<7;i++)r.push(r[i-1]+(i%2?a:-b));return{id:'alt',a:r,rule:`加 ${a}、減 ${b} 輪流`};},
  ()=>{const s=R.int(1,10),d=R.int(1,3);const r=[s];for(let i=1;i<7;i++)r.push(r[i-1]+d+i-1);return{id:'inc',a:r,rule:`每次多加 1（加 ${d}、${d+1}、${d+2}⋯）`};},
  ()=>{const s=R.int(1,3);return{id:'tri',a:[...Array(6)].map((_,n)=>s*3**n),rule:'每次乘以 3'};},
  ()=>{const s1=R.int(1,9),s2=R.int(10,40),a=R.int(2,5),b=R.int(2,5)*R.pick([1,-1]);const r=[];for(let i=0;i<8;i++)r.push(i%2===0?s1+a*(i/2):s2+b*((i-1)/2));return{id:'two',a:r,rule:`單數位置每次加 ${a}，雙數位置每次${b>0?'加':'減'} ${Math.abs(b)}（兩組數字交錯）`};},
 ],
 3:[
  ()=>{const r=[R.int(1,4),R.int(2,6)];for(let i=2;i<8;i++)r.push(r[i-1]+r[i-2]);return{id:'fib',a:r,rule:'前兩個數相加，等於下一個數'};},
  ()=>{const s=R.int(1,4);const r=[s];for(let i=1;i<6;i++)r.push(r[i-1]*2+1);return{id:'x2p1',a:r,rule:'乘以 2 再加 1'};},
  ()=>{const k=R.int(1,5);return{id:'sq',a:[...Array(7)].map((_,n)=>(k+n)*(k+n)),rule:'連續的數自己乘自己（平方數）'};},
  ()=>{const s=R.int(1,10);const r=[s];for(let i=1;i<7;i++)r.push(r[i-1]+2**(i-1));return{id:'dd',a:r,rule:'相差 1、2、4、8⋯，差距每次加倍'};},
  ()=>{const s=R.int(2,6);const r=[s];for(let i=1;i<7;i++)r.push(i%2?r[i-1]*2:r[i-1]-1);return{id:'x2m1',a:r,rule:'乘以 2、減 1 輪流'};},
  ()=>{const s=R.int(1,10),d=R.int(1,3);const r=[s];for(let i=1;i<7;i++)r.push(r[i-1]+d+2*(i-1));return{id:'odd',a:r,rule:`相差 ${d}、${d+2}、${d+4}⋯，差距每次加 2`};},
 ]
};
function pageSeq(lv){
  const groups=[],ans=[];let prev='';
  for(let i=0;i<8;i++){
    let z;do{z=R.pick(SEQ[lv])();}while(z.id===prev);prev=z.id;
    const L=z.a.length;let blanks;
    if(lv===1) blanks=[L-1];
    else if(lv===2) blanks=[R.int(2,L-1)];
    else{const c=R.shuffle([...Array(L-2).keys()].map(x=>x+2));blanks=c.slice(0,2).sort((x,y)=>x-y);}
    const cw=Math.min(20,150/L);
    const row=[{t:`${i+1}.`,nb:true,b:true,c:TEAL,al:'left'}].concat(z.a.map((v,j)=>blanks.includes(j)?{t:'',bg:BLANK_BG}:{t:String(v)}));
    groups.push(G([T([row],[12,...Array(L).fill(cw)],15,19)]));
    ans.push(P([{t:`${i+1}.　`,b:true},{t:blanks.map(j=>z.a[j]).join('、'),b:true,c:ORANGE},{t:`　（${z.rule}）`}],14,{after:2.5}));
  }
  return {groups,ans:[G(ans)]};
}

/* ---------- 3 迷你數獨 ---------- */
function sdCount(g,N,br,bc,cap){
  let cnt=0;
  const ok=(r,c,v)=>{for(let i=0;i<N;i++){if(g[r][i]===v||g[i][c]===v)return false;}
    const r0=r-r%br,c0=c-c%bc;for(let i=0;i<br;i++)for(let j=0;j<bc;j++)if(g[r0+i][c0+j]===v)return false;return true;};
  (function rec(){
    if(cnt>=cap)return;
    for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!g[r][c]){
      for(let v=1;v<=N;v++)if(ok(r,c,v)){g[r][c]=v;rec();g[r][c]=0;if(cnt>=cap)return;}
      return;
    }
    cnt++;
  })();
  return cnt;
}
function genSudoku(N,br,bc,target){

/* ---------- 4 推理偵探 ---------- */
const PEOPLE=['王奶奶','李爺爺','陳阿姨','林伯伯','張奶奶','黃爺爺'];
const CATS=[
  {name:'飲料',vals:['咖啡','紅茶','豆漿','綠茶'],pos:v=>`喝${v}`,neg:v=>`不喝${v}`,who:v=>`喝${v}的人`},
  {name:'興趣',vals:['下棋','唱歌','種花','散步'],pos:v=>`喜歡${v}`,neg:v=>`不喜歡${v}`,who:v=>`喜歡${v}的人`},
  {name:'水果',vals:['香蕉','蘋果','芭樂','西瓜'],pos:v=>`愛吃${v}`,neg:v=>`不愛吃${v}`,who:v=>`愛吃${v}的人`},
  {name:'衣服',vals:['紅色','藍色','黃色','綠色'],pos:v=>`穿${v}衣服`,neg:v=>`沒有穿${v}衣服`,who:v=>`穿${v}衣服的人`},
];
function perms(n){if(n===1)return[[0]];const out=[];perms(n-1).forEach(p=>{for(let i=0;i<=p.length;i++){const q=p.slice();q.splice(i,0,n-1);out.push(q);}});return out;}
function lgCount(nC,PS,clues,cap){
  let cnt=0;const a=new Array(nC);
  (function rec(ci){
    if(cap&&cnt>=cap)return;
    if(ci===nC){for(const c of clues)if(!c.f(a))return;cnt++;return;}
    for(const p of PS){a[ci]=p;rec(ci+1);if(cap&&cnt>=cap)return;}
  })(0);
  return cnt;
}
function genLogic(lv){
  const nP=lv===1?3:4,nC=lv===3?3:2;
  const ppl=R.shuffle(PEOPLE).slice(0,nP);
  const cats=R.shuffle(CATS).slice(0,nC).map(c=>({...c,vals:R.shuffle(c.vals).slice(0,nP)}));
  const sol=cats.map(()=>R.shuffle([...Array(nP).keys()]));
  const PS=perms(nP);
  const wPos=lv===1?.8:lv===2?.3:.15;
  const pool=[];
  for(let p=0;p<nP;p++)cats.forEach((cat,ci)=>{
    for(let v=0;v<nP;v++){
      if(sol[ci][p]===v)pool.push({w:wPos,t:`${ppl[p]}${cat.pos(cat.vals[v])}。`,f:a=>a[ci][p]===v});
      else pool.push({w:1,t:`${ppl[p]}${cat.neg(cat.vals[v])}。`,f:a=>a[ci][p]!==v});
    }
    if(lv>=2){const v1=sol[ci][p];const v2=R.pick([...Array(nP).keys()].filter(x=>x!==v1));const o=R.shuffle([v1,v2]);
      pool.push({w:.8,t:`${ppl[p]}不是${cat.pos(cat.vals[o[0]])}，就是${cat.pos(cat.vals[o[1]])}。`,f:a=>a[ci][p]===o[0]||a[ci][p]===o[1]});}
  });
  for(let ci=0;ci<nC;ci++)for(let cj=0;cj<nC;cj++)if(ci!==cj)for(let v1=0;v1<nP;v1++)for(let v2=0;v2<nP;v2++){
    const x=sol[ci].indexOf(v1);const same=sol[cj][x]===v2;
    const t=`${cats[ci].who(cats[ci].vals[v1])}${same?cats[cj].pos(cats[cj].vals[v2]):cats[cj].neg(cats[cj].vals[v2])}。`;
    pool.push({w:same?1.1:.9,t,f:a=>(a[cj][a[ci].indexOf(v1)]===v2)===same});
  }
  let clues=[],cur=lgCount(nC,PS,[],0);
  while(cur>1&&pool.length){
    let s=pool.reduce((x,c)=>x+c.w,0)*Math.random(),idx=0;
    for(;idx<pool.length-1;idx++){s-=pool[idx].w;if(s<=0)break;}
    const c=pool.splice(idx,1)[0];const n=lgCount(nC,PS,[...clues,c],0);
    if(n<cur){clues.push(c);cur=n;}
  }
  if(lv>=2)for(let i=clues.length-1;i>=0;i--){const t=clues.filter((_,j)=>j!==i);if(lgCount(nC,PS,t,2)===1)clues=t;}
  return {ppl,cats,sol,clues:R.shuffle(clues),nP,nC};
}
function pageLogic(lv){

function pageCancel(lv){
  const RW=11,CL=10;
  for(let tries=0;tries<100;tries++){
    const t=R.int(2,9);const u=R.pick([1,2,3,4,5,6,7,8,9].filter(x=>x!==t));const k=R.pick([1,2,3,4,5,6,7,8,9].filter(x=>x!==t&&x!==u));
    const g=[...Array(RW)].map(()=>[...Array(CL)].map(()=>{const r=Math.random();return r<.16?t:(lv===3&&r<.28?u:R.int(1,9));}));
    const mark=g.map(r=>r.map(()=>0));let rule=[];
    if(lv===1){
      g.forEach(r=>r.forEach((v,c)=>{if(v===t&&c<CL-1&&Math.random()<.35)r[c+1]=k;}));
      g.forEach((r,ri)=>r.forEach((v,c)=>{if(v===t&&!(c<CL-1&&r[c+1]===k))mark[ri][c]=1;}));
      rule=[`請圈出所有的「${t}」。`,`但如果「${t}」的右邊緊接著「${k}」，這個「${t}」就不要圈。`];
    }else{
      const par=R.pick(['偶數','奇數']);const isP=x=>par==='偶數'?x%2===0:x%2===1;
      if(lv===3){g.forEach(r=>r.forEach((v,c)=>{if(v===u&&c<CL-1&&Math.random()<.4)r[c+1]=k;}));}
      g.forEach((r,ri)=>r.forEach((v,c)=>{if(v===t&&c>0&&isP(r[c-1]))mark[ri][c]=1;}));
      rule=[`請圈出「左邊緊鄰的數字是${par}」的「${t}」。`];
      if(lv===3){g.forEach((r,ri)=>r.forEach((v,c)=>{if(v===u&&c<CL-1&&r[c+1]===k)mark[ri][c]=2;}));rule.push(`另外，請把右邊緊接著「${k}」的「${u}」劃掉。`);}
      rule.push('每一橫排的第一個數字左邊沒有數字，只看同一橫排。');
    }
    const n1=mark.flat().filter(x=>x===1).length,n2=mark.flat().filter(x=>x===2).length;
    if(n1<5||(lv===3&&n2<3))continue;
    const grid=(ans)=>T(g.map((r,ri)=>r.map((v,c)=>{const cl={t:String(v)};if(ans&&mark[ri][c]===1){cl.bg='#CDEBEC';cl.b=true;cl.c=TEAL;}if(ans&&mark[ri][c]===2){cl.bg='#FBD9CC';cl.b=true;cl.c=ORANGE;}return cl;})),Array(CL).fill(ans?11:15.5),ans?10:15.5,ans?14:21,{bc:'#B9B0A4',bw:.5});
    const ruleG=G(rule.map((s,i)=>P(s,i===rule.length-1&&lv>1?14:17,{after:1.2})),true);
    const cnt=G([P(lv===3?'我圈了＿＿＿個，劃掉了＿＿＿個。':'我總共圈了＿＿＿個。',17,{align:'right'})]);
    const ansTxt=lv===3?`應圈 ${n1} 個（綠底）、應劃掉 ${n2} 個（橘底）`:`應圈 ${n1} 個（綠底）`;
    return {groups:[ruleG,G([grid(false)]),cnt],ans:[G([P([{t:ansTxt,b:true}],15,{after:3}),grid(true)])]};
  }
}

      v=o[0]==='+'?v+o[1]:o[0]==='-'?v-o[1]:o[0]==='*'?v*o[1]:v/o[1];
      if(o[0]==='*'||o[0]==='/')md++;
      if(v<1||v>250)ok=false;ops.push(o);vals.push(v);
    }
    if(!ok)continue;if(lv===2&&md<1)continue;if(lv===3&&md<2)continue;
    return {start,ops,vals};
  }
}
const OPS={'+':'+','-':'−','*':'×','/':'÷'};
function pageChain(lv){
  const groups=[],ans=[];
  for(let i=0;i<6;i++){
    const z=genChain(lv);
    const row=[{t:`${i+1}.`,nb:true,b:true,c:TEAL,al:'left',sz:15},{t:String(z.start),b:true,bg:GIVEN_BG}];const w=[9,18];
    z.ops.forEach(o=>{row.push({t:`${OPS[o[0]]}${o[1]}`,nb:true,b:true,c:TEAL,sz:15});w.push(14);row.push({t:''});w.push(17);});
    groups.push(G([T([row],w,17,19)]));
    ans.push(P([{t:`${i+1}.　`,b:true},{t:`${z.start} → ${z.vals.join(' → ')}`,c:ORANGE,b:true}],16,{after:3}));
  }
  return {groups,ans:[G(ans)]};
}

/* 把所有頁面放進容器；wrap=true 時外面包預覽縮放框 */
function buildPages(host,wrap){

  list.forEach(pg=>{

/* ---------- 下載 ---------- */

/* PPT（pptx）：依照預覽版面逐一量位置，轉成可修改的文字方塊、色塊與表格 */
const PX=96,FF='Microsoft JhengHei';
const hex=c=>{const m=(c||'').match(/[\d.]+/g);if(!m||m.length<3)return null;if(m.length>=4&&+m[3]===0)return null;return m.slice(0,3).map(v=>Math.round(+v).toString(16).padStart(2,'0')).join('').toUpperCase();};
const pt=px=>+(px*0.75).toFixed(1);
function runsOf(el){
  const out=[];const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;
  while((n=tw.nextNode())){if(!n.nodeValue)continue;const cs=getComputedStyle(n.parentElement);
    out.push({text:n.nodeValue,options:{color:hex(cs.color)||'12343B',bold:+cs.fontWeight>=600,fontSize:pt(parseFloat(cs.fontSize)),fontFace:FF}});}
  return out;
}
function drawBox(sl,el,R0){
  const cs=getComputedStyle(el),r=el.getBoundingClientRect();
  const x=(r.left-R0.left)/PX,y=(r.top-R0.top)/PX,w=r.width/PX,h=r.height/PX;
  const bg=hex(cs.backgroundColor);
  const sides=['Top','Right','Bottom','Left'].map(s=>({w:cs['border'+s+'Style']==='none'?0:(parseFloat(cs['border'+s+'Width'])||0),c:hex(cs['border'+s+'Color'])}));
  const uni=sides[0].w>0&&sides.every(s=>s.w===sides[0].w&&s.c===sides[0].c);
  if(bg||uni)sl.addShape('rect',{x,y,w,h,fill:bg?{color:bg}:{type:'none'},line:uni?{color:sides[0].c,width:pt(sides[0].w)}:{type:'none'}});
  if(!uni)sides.forEach((s,i)=>{if(!s.w||!s.c)return;const t=s.w/PX;
    const g=i===0?{x,y,w,h:t}:i===1?{x:x+w-t,y,w:t,h}:i===2?{x,y:y+h-t,w,h:t}:{x,y,w:t,h};
    sl.addShape('rect',Object.assign(g,{fill:{color:s.c},line:{type:'none'}}));});
}
function drawText(sl,el,R0,o={}){
  const runs=runsOf(el);if(!runs.length||!el.textContent.trim())return;
  const cs=getComputedStyle(el),r=el.getBoundingClientRect();
  const pl=parseFloat(cs.paddingLeft)||0,pr=parseFloat(cs.paddingRight)||0,ptp=parseFloat(cs.paddingTop)||0,pb=parseFloat(cs.paddingBottom)||0;
  const al=cs.textAlign==='center'?'center':cs.textAlign==='right'||cs.textAlign==='end'?'right':'left';
  const ex=o.extra||0.06;let x=(r.left-R0.left+pl)/PX;const w=(r.width-pl-pr)/PX+ex;
  if(al==='right')x-=ex;else if(al==='center')x-=ex/2;
  sl.addText(runs,{x,y:(r.top-R0.top+ptp)/PX,w,h:Math.max(0.15,(r.height-ptp-pb)/PX),margin:0,valign:o.valign||'middle',align:al,fontFace:FF,wrap:o.wrap!==false,fit:'none',lineSpacingMultiple:o.lsm||1.1});
}
function drawTable(sl,tb,R0){
  const r=tb.getBoundingClientRect();
  const colW=[...tb.querySelectorAll('col')].map(c=>parseFloat(c.style.width)/25.4);
  const trs=[...tb.querySelectorAll('tr')];
  const rowH=trs.map(tr=>tr.getBoundingClientRect().height/PX);
  const rows=trs.map(tr=>[...tr.children].map(td=>{
    const cs=getComputedStyle(td);
    const bd=['Top','Right','Bottom','Left'].map(s=>{const w=cs['border'+s+'Style']==='none'?0:parseFloat(cs['border'+s+'Width'])||0;return w?{type:'solid',pt:pt(w),color:hex(cs['border'+s+'Color'])||'12343B'}:{type:'none'};});
    const o={fontFace:FF,fontSize:pt(parseFloat(cs.fontSize)),bold:+cs.fontWeight>=600,color:hex(cs.color)||'12343B',align:cs.textAlign==='left'?'left':'center',valign:'middle',margin:0,border:bd};
    const bg=hex(cs.backgroundColor);if(bg)o.fill={color:bg};
    if(td.colSpan>1)o.colspan=td.colSpan;
    return {text:td.textContent,options:o};
  }));
  sl.addTable(rows,{x:(r.left-R0.left)/PX,y:(r.top-R0.top)/PX,colW,rowH,margin:0,autoPage:false,fontFace:FF});
}
/* 需要時才載入 PPT 元件，一個來源失敗就換下一個 */
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>{s.remove();no(new Error(src));};document.head.appendChild(s);});}
async function ensurePptx(){
  if(window.PptxGenJS)return true;
  const srcs=['https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js','https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js','https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js'];
  for(const s of srcs){try{await loadScript(s);if(window.PptxGenJS)return true;}catch(e){}}
  return false;
}
async function makePPTX(){
  const list=pageList();if(!list.length)return;
  busy(true,'正在載入 PPT 元件⋯');
  if(!(await ensurePptx())){busy(false,'PPT 元件載入失敗，請確認網路連線後再按一次。');return;}
  busy(true,'正在產生 PPT⋯');
  const cap=$('capture');buildPages(cap,false);fit(cap);
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;fit(cap);
  const pptx=new PptxGenJS();pptx.defineLayout({name:'A4P',width:8.27,height:11.69});pptx.layout='A4P';
  pptx.title=S.title||'動腦挑戰單';
  cap.querySelectorAll('.page').forEach(pg=>{
    const R0=pg.getBoundingClientRect();const sl=pptx.addSlide();sl.background={color:'FFFFFF'};
    pg.querySelectorAll('.ph,.ph-name i,.tg,.ph-inst,.grp.box,.unit,.uh b,.pf').forEach(el=>drawBox(sl,el,R0));
    pg.querySelectorAll('table.bt').forEach(tb=>drawTable(sl,tb,R0));
    pg.querySelectorAll('.ph-title,.ph-level,.pf>span,.uh span').forEach(el=>drawText(sl,el,R0,{wrap:false,extra:0.3}));
    pg.querySelectorAll('.ph-name>span,.tg,.uh b').forEach(el=>drawText(sl,el,R0,{wrap:false,extra:0.12}));
    pg.querySelectorAll('.ph-inst').forEach(el=>drawText(sl,el,R0,{valign:'top',lsm:1.2}));
    pg.querySelectorAll('.bp').forEach(el=>drawText(sl,el,R0,{valign:'top',extra:0.2}));
  });
  cap.innerHTML='';
  const blob=await pptx.write({outputType:'blob'});
  const r=await saveFile(fname('pptx'),blob);
  busy(false,r==='declined'?'已取消下載。':r==='busy'?'另一個下載視窗還開著，請稍候再試。':'PPT 檔已準備好，每一頁就是一張 A4，文字和表格都可以直接修改。');
}

/* ---------- 介面 ---------- */
function syncUI(){
  $('title').value=S.title;$('footer').value=S.footer;$('nameLine').checked=S.nameLine;$('ansMode').value=S.ans;$('cOut').textContent=S.copies;
  document.querySelectorAll('#lv button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===S.lv)));
  document.querySelectorAll('#fs button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===S.fs)));
  document.querySelectorAll('#types input').forEach(i=>i.checked=S.types.includes(i.value));
}
$('types').innerHTML=TYPES.map(t=>`<label class="tchip"><input type="checkbox" value="${t.id}"><span class="in"><span class="g">${esc(t.glyph)}</span><span><b>${esc(t.name)}</b><small>${esc(t.desc)}</small></span></span></label>`).join('');
const regen=()=>{save();generate();render();};
const relayout=()=>{save();render();};
$('types').addEventListener('change',()=>{S.types=TYPES.map(t=>t.id).filter(id=>document.querySelector(`#types input[value="${id}"]`).checked);regen();});
$('allT').onclick=()=>{S.types=TYPES.map(t=>t.id);syncUI();regen();};
$('noneT').onclick=()=>{S.types=[];syncUI();regen();};
document.querySelectorAll('#lv button').forEach(b=>b.onclick=()=>{S.lv=+b.dataset.v;syncUI();regen();});
document.querySelectorAll('#fs button').forEach(b=>b.onclick=()=>{S.fs=+b.dataset.v;syncUI();relayout();});
$('cMinus').onclick=()=>{if(S.copies>1){S.copies--;syncUI();regen();}};
$('cPlus').onclick=()=>{if(S.copies<10){S.copies++;syncUI();regen();}};
$('ansMode').onchange=e=>{S.ans=e.target.value;relayout();};
$('nameLine').onchange=e=>{S.nameLine=e.target.checked;relayout();};
let tmr;const typed=(k)=>e=>{S[k]=e.target.value;clearTimeout(tmr);tmr=setTimeout(relayout,250);};
$('title').oninput=typed('title');$('footer').oninput=typed('footer');
$('regen').onclick=()=>{regen();$('status').textContent='已換成一組新題目。';};
$('dlPdf').onclick=()=>makePDF().catch(e=>{console.error(e);busy(false,'PDF 產生失敗，請再試一次。');});
$('dlPpt').onclick=()=>makePPTX().catch(e=>{console.error(e);busy(false,'PPT 產生失敗，請再試一次。');});
window.addEventListener('resize',layoutPreview);
syncUI();generate();render();
setTimeout(()=>{ensurePptx();},1500);
</script>
